[project]
name = "dotcor-backend"
version = "0.0.1"
description = "Backend for dotcor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "locust>=2.46.3",
    "phonenumbers>=9.0.34",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = "."
